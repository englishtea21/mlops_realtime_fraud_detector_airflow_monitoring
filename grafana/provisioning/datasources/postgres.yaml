apiVersion: 1

datasources:
  - name: PostgreSQL
    uid: postgres-scores
    type: postgres
    access: proxy
    url: ${POSTGRES_HOST}:${POSTGRES_PORT}
    user: $POSTGRES_USER
    isDefault: false
    secureJsonData:
      password: $POSTGRES_PASSWORD
    jsonData:
      database: $POSTGRES_DB
      sslmode: disable
      postgresVersion: 1500
      timescaledb: false
      maxOpenConns: 5
      maxIdleConns: 5
